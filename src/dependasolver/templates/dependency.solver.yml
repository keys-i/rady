name: Rady dependasolve

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
__WORKFLOW_RUN_TRIGGER__
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  push:
    paths:
      - '.github/workflows/dependasolver.yml'
      - '.github/workflows/scripts/select-review-targets.sh'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Optional pull request number; leave blank to review the open Dependabot backlog
        required: false
        type: string

permissions: {}

jobs:
  select:
    name: Choose pull requests
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: rady-selection-${{ github.repository }}-${{ inputs.pr-number || 'backlog' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-prs: ${{ steps.targets.outputs.has-prs }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false
      - name: Select requested or pending pull-request reviews
        id: targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr-number || '' }}
        run: bash .github/workflows/scripts/select-review-targets.sh

  review-current:
    name: Rady dependasolve gate
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.workflow_run.name, 'Rady dependasolve')) ||
      (github.event_name == 'check_run' &&
      github.event.check_run.status == 'completed' &&
      github.event.check_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.check_run.name, 'Rady dependasolve gate') &&
      !startsWith(github.event.check_run.name, 'Rady dependasolve /'))
    permissions:
      contents: read
      pull-requests: write
    uses: __SOLVER_REF__
    with:
      solver-ref: __SOURCE_REF__
      app-client-id: __APP_CLIENT_ID__
      required-checks: '__REQUIRED_CHECKS__'
      model: ${{ vars.RADY_MODEL || '' }}
      model-choices: ${{ vars.RADY_MODEL_CHOICES || '' }}
      harness: ${{ vars.RADY_HARNESS || 'codex' }}
      pr-number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number }}
    secrets:
      app-private-key: __APP_PRIVATE_KEY__

  review:
    name: Rady dependasolve gate
    needs: select
    if: needs.select.outputs.has-prs == 'true'
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr-number: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: __SOLVER_REF__
    with:
      solver-ref: __SOURCE_REF__
      app-client-id: __APP_CLIENT_ID__
      required-checks: '__REQUIRED_CHECKS__'
      model: ${{ vars.RADY_MODEL || '' }}
      model-choices: ${{ vars.RADY_MODEL_CHOICES || '' }}
      harness: ${{ vars.RADY_HARNESS || 'codex' }}
      pr-number: ${{ matrix.pr-number }}
    secrets:
      app-private-key: __APP_PRIVATE_KEY__

  respond:
    name: Respond to Rady mention
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.comment.body == '@radyybot' ||
      startsWith(github.event.comment.body, '@radyybot ')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: __RESPONDER_REF__
    with:
      solver-ref: __SOURCE_REF__
      app-client-id: __APP_CLIENT_ID__
      issue-number: ${{ github.event.issue.number }}
      comment-id: ${{ github.event.comment.id }}
      gemini-private-ok: ${{ vars.RADY_GEMINI_PRIVATE_OK == 'true' }}
      xai-private-ok: ${{ vars.RADY_XAI_PRIVATE_OK == 'true' }}
    secrets:
      app-private-key: __APP_PRIVATE_KEY__
      gemini-api-key: ${{ secrets.RADY_GEMINI_API_KEY }}
      cerebras-api-key: ${{ secrets.RADY_CEREBRAS_API_KEY }}
      xai-api-key: ${{ secrets.RADY_XAI_API_KEY }}
