name: Rady dependasolve

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  # == Event-driven re-review ==
  # GitHub Actions completion and third-party check runs re-run the evidence gate
  # Legacy commit statuses stay gated and can be re-run from workflow dispatch
__WORKFLOW_RUN_TRIGGER__
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to review again using the current CI results
        required: true
        type: number

permissions: {}

jobs:
  review:
    name: Rady dependasolve gate
    permissions:
      contents: write
      pull-requests: write
    uses: __SOLVER_REF__
    with:
      solver-ref: __SOURCE_REF__
      app-client-id: ${{ vars.DEPENDASOLVER_APP_CLIENT_ID }}
      rady-app-client-id: ${{ vars.RADY_APP_CLIENT_ID }}
      required-checks: '__REQUIRED_CHECKS__'
      model: ${{ vars.RADY_MODEL || '' }}
      harness: ${{ vars.RADY_HARNESS || 'codex' }}
      pr-number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || inputs.pr-number || 0 }}
    secrets:
      app-private-key: ${{ secrets.DEPENDASOLVER_APP_PRIVATE_KEY }}
      rady-app-private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}
