name: Rady dependasolve

on:
  workflow_call:
    inputs:
      solver-ref:
        description: Trusted solver source, keys-i/rady@40-lowercase-hex SHA
        required: true
        type: string
      app-client-id:
        required: true
        type: string
      required-checks:
        description: JSON array of required CI check names
        required: true
        type: string
      model:
        type: string
        default: ''
      model-choices:
        description: Comma-separated native models available to Rady's local selector
        type: string
        default: ''
      harness:
        description: Installed, authenticated native agent CLI
        type: string
        default: codex
      pr-number:
        type: number
        default: 0
    secrets:
      app-private-key:
        required: true

permissions: {}

concurrency:
  group: rady-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      ((github.event_name == 'pull_request_target' && github.event.action != 'closed' && !github.event.pull_request.draft) ||
      (inputs.pr-number > 0) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.workflow_run.name, 'Rady dependasolve')) ||
      (github.event_name == 'check_run' &&
      github.event.check_run.status == 'completed' &&
      github.event.check_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.check_run.name, 'Rady dependasolve gate') &&
      !startsWith(github.event.check_run.name, 'Rady dependasolve /')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.pull.outputs.allowed }}
      dependency: ${{ steps.pull.outputs.dependency }}
      head: ${{ steps.pull.outputs.head }}
      number: ${{ steps.pull.outputs.number }}
    steps:
      - name: Validate pull request trust boundary
        id: pull
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || inputs.pr-number }}
        run: |
          set -euo pipefail
          echo 'allowed=false' >> "$GITHUB_OUTPUT"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'PR number must be positive' >&2
            exit 1
          }
          pull=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          jq -e --arg repo "$GH_REPO" --argjson number "$PR_NUMBER" '
            .number == $number and
            .state == "open" and .draft == false and
            .base.repo.full_name == $repo and
            (.head.sha | type == "string" and test("^[a-f0-9]{40}$"))
          ' <<<"$pull" > /dev/null
          dependency=$(jq -r '.user.login == "dependabot[bot]"' <<<"$pull")
          if [[ "$PRIVATE_REPOSITORY" != true ]]; then
            jq -e --arg repo "$GH_REPO" '
              .head.repo.full_name == $repo and
              (.user.login == "dependabot[bot]" or
                .author_association == "OWNER" or
                .author_association == "MEMBER" or
                .author_association == "COLLABORATOR")
            ' <<<"$pull" > /dev/null || {
              echo 'Public repositories run Rady only for same-repository Dependabot or trusted collaborator pull requests' >&2
              exit 0
            }
          fi
          {
            echo 'allowed=true'
            echo "dependency=$dependency"
            echo "head=$(jq -r '.head.sha' <<<"$pull")"
            echo "number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: preflight
    if: needs.preflight.outputs.allowed == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require a native public review harness
        if: github.event.repository.private != true
        shell: bash
        env:
          RADY_HARNESS: ${{ inputs.harness }}
        run: |
          set -euo pipefail
          case "$RADY_HARNESS" in
            codex|claude) ;;
            *) echo 'Public repositories require the bounded Codex or Claude harness' >&2; exit 1 ;;
          esac
      - name: Suspend stale Dependabot auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'PR number must be positive' >&2
            exit 1
          }
          pull=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          author=$(jq -er '.user.login | select(type == "string")' <<<"$pull")
          if [[ "$author" != 'dependabot[bot]' ]]; then
            exit 0
          fi
          if ! jq -e --arg repo "$GH_REPO" '
            .state == "open" and
            .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            ((.html_url | type) == "string") and
            (.html_url | startswith("https://github.com/" + $repo + "/pull/"))
          ' <<<"$pull" > /dev/null; then
            echo 'Dependabot PR state is not trusted; refusing to leave stale auto-merge enabled' >&2
            exit 1
          fi
          if jq -e '.auto_merge != null' <<<"$pull" > /dev/null; then
            url=$(jq -er '.html_url' <<<"$pull")
            gh pr merge "$url" --disable-auto
          fi
      - name: Validate trusted solver source
        id: source
        shell: bash
        env:
          SOLVER_REF: ${{ inputs.solver-ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOLVER_REF" =~ ^keys-i/rady@([a-f0-9]{40})$ ]]; then
            echo 'solver-ref must be keys-i/rady@40_LOWERCASE_COMMIT_SHA' >&2
            exit 1
          fi
          echo 'repository=keys-i/rady' >> "$GITHUB_OUTPUT"
          echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # Check out only the immutable solver source, never the PR or its scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Identify Rust toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Rady build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rady-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ steps.source.outputs.sha }}-${{ hashFiles('Cargo.lock') }}
      - name: Build the trusted solver
        run: cargo build --release --locked --bin rady
      - name: Verify the authenticated agent harness
        env:
          RADY_HARNESS: ${{ inputs.harness }}
        run: target/release/rady agent doctor --harness "$RADY_HARNESS"
      - name: Resolve PR author and commit
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
        run: target/release/rady agent resolve --repo "$GH_REPO" --pr "$PR_NUMBER"
      - name: Require the selected App credentials
        shell: bash
        env:
          DEPENDENCY: ${{ steps.pr.outputs.dependency }}
          EXPECTED_DEPENDENCY: ${{ needs.preflight.outputs.dependency }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head }}
          HEAD: ${{ steps.pr.outputs.head }}
          APP_ID: ${{ inputs.app-client-id }}
          APP_KEY: ${{ secrets.app-private-key }}
        run: |
          set -euo pipefail
          if [[ "$DEPENDENCY" != "$EXPECTED_DEPENDENCY" || "$HEAD" != "$EXPECTED_HEAD" ]]; then
            echo 'The pull request changed after preflight; rerun on the current state' >&2
            exit 1
          fi
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo 'Configure the selected Rady App client ID and private key' >&2
            exit 1
          fi
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-checks: read
          permission-statuses: read
          permission-issues: write
          permission-pull-requests: write
      # == Canonical pull request evidence ==
      # Load fresh API state without checking out or running PR-controlled code
      - name: Fetch current pull request state
        id: pr-state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'PR number must be positive' >&2
            exit 1
          }
          pull=''
          for _ in 1 2 3 4 5 6; do
            pull=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
            mergeable=$(jq -r '.mergeable // "unknown"' <<<"$pull")
            mergeable_state=$(jq -r '.mergeable_state // "unknown"' <<<"$pull")
            if [[ "$mergeable" != unknown && "$mergeable_state" != unknown ]]; then
              break
            fi
            sleep 2
          done
          jq -e --arg head "$EXPECTED_HEAD" '
            .state == "open" and .draft == false and
            .head.sha == $head and
            (.html_url | type == "string" and startswith("https://")) and
            (.base.ref | type == "string" and length > 0) and
            (.base.sha | type == "string" and test("^[a-f0-9]{40}$"))
          ' <<<"$pull" > /dev/null
          event="$RUNNER_TEMP/rady-pull-request-event.json"
          jq -n --argjson pull "$pull" '{pull_request: $pull}' > "$event"
          {
            echo "event=$event"
            echo "url=$(jq -r .html_url <<<"$pull")"
            echo "head=$(jq -r .head.sha <<<"$pull")"
            echo "base=$(jq -r .base.ref <<<"$pull")"
            echo "base_sha=$(jq -r .base.sha <<<"$pull")"
            echo "mergeable=$mergeable"
            echo "mergeable_state=$mergeable_state"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch verified Dependabot metadata
        if: steps.pr.outputs.dependency == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        env:
          # Supply the freshly verified PR payload for manual and check-run events
          GITHUB_EVENT_PATH: ${{ steps.pr-state.outputs.event }}
        with:
          compat-lookup: true
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Review the diff and current CI evidence
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RADY_MODEL: ${{ inputs.model }}
          RADY_MODEL_CHOICES: ${{ inputs.model-choices }}
          RADY_HARNESS: ${{ inputs.harness }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
          EXPECTED_HEAD: ${{ steps.pr-state.outputs.head }}
          SCORE: ${{ steps.metadata.outputs.compatibility-score }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: target/release/rady agent review --repo "$GH_REPO" --pr "$PR_NUMBER"
      - name: Prepare a safe replacement for a conflicted Dependabot update
        id: repair-spec
        if: >-
          steps.review.outputs.approved == 'true' &&
          steps.pr.outputs.dependency == 'true' &&
          fromJSON(steps.metadata.outputs.compatibility-score || '0') >= 95 &&
          fromJSON(steps.metadata.outputs.compatibility-score || '0') <= 100 &&
          contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type) &&
          steps.metadata.outputs.maintainer-changes == 'false' &&
          steps.pr-state.outputs.mergeable == 'false' &&
          steps.pr-state.outputs.mergeable_state == 'dirty'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr-state.outputs.head }}
          EXPECTED_BASE: ${{ steps.pr-state.outputs.base_sha }}
          SCORE: ${{ steps.metadata.outputs.compatibility-score }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          SPEC: ${{ runner.temp }}/rady-repair-spec.json
        run: |
          set -euo pipefail
          target/release/rady agent prepare-repair \
            --repo "$GH_REPO" \
            --pr "$PR_NUMBER" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-base "$EXPECTED_BASE" \
            --output "$SPEC"
          jq -e '
            type == "object" and
            (.task | type == "string" and length > 0 and length <= 32000) and
            (.scope | type == "array" and length > 0 and length <= 20 and all(.[]; type == "string" and length > 0)) and
            (.tasks | type == "array" and length == 1) and
            .checks == ["test"] and
            .acceptance_checks == [{
              "criterion": 0,
              "command": "git diff --check",
              "expected_exit": 0,
              "expected_output": "",
              "files": []
            }]
          ' "$SPEC" > /dev/null
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
      - name: Check out the verified current base for replacement
        if: steps.repair-spec.outputs.spec != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr-state.outputs.base_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: rady-repair-target
          persist-credentials: false
      - name: Open replacement pull request
        id: replacement
        if: steps.repair-spec.outputs.spec != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RADY_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ steps.pr-state.outputs.base }}
          BASE_SHA: ${{ steps.pr-state.outputs.base_sha }}
          SPEC: ${{ steps.repair-spec.outputs.spec }}
          RADY_MODEL: ${{ inputs.model }}
          RADY_MODEL_CHOICES: ${{ inputs.model-choices }}
          RADY_HARNESS: ${{ inputs.harness }}
          RESULT: ${{ runner.temp }}/rady-replacement.json
        run: |
          set -euo pipefail
          [[ "$GH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'invalid repository name' >&2
            exit 1
          }
          command=(target/release/rady --output json code --spec "$SPEC" --directory rady-repair-target --pr --repo "$GH_REPO" --base "$BASE_BRANCH" --expected-start "$BASE_SHA" --timeout 1800 --max-lines 1000)
          "${command[@]}" > "$RESULT"
          replacement_url=$(jq -er '.schema == 1 and .status == "ok" and .kind == "code" and (.result.url | type == "string") | .result.url' "$RESULT")
          expected="https://github.com/$GH_REPO/pull/"
          [[ "$replacement_url" == "$expected"* ]] || {
            echo 'Rady returned an unexpected replacement pull request URL' >&2
            exit 1
          }
          number=${replacement_url#"$expected"}
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Rady returned an invalid replacement pull request URL' >&2
            exit 1
          }
          echo "url=$replacement_url" >> "$GITHUB_OUTPUT"
      - name: Link the original Dependabot update to its replacement
        if: steps.replacement.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          REPLACEMENT_URL: ${{ steps.replacement.outputs.url }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg url "$REPLACEMENT_URL" '{body: "Superseded by replacement " + $url}')
          gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input - <<<"$body" > /dev/null
      - name: Require protected branch and enable auto-merge
        if: >-
          steps.review.outputs.enable_auto_merge == 'true' &&
          fromJSON(steps.metadata.outputs.compatibility-score || '0') >= 95 &&
          fromJSON(steps.metadata.outputs.compatibility-score || '0') <= 100 &&
          contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type) &&
          steps.metadata.outputs.maintainer-changes == 'false' &&
          steps.pr-state.outputs.mergeable == 'true' &&
          steps.pr-state.outputs.mergeable_state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.pr-state.outputs.url }}
          HEAD_SHA: ${{ steps.pr-state.outputs.head }}
          BASE_BRANCH: ${{ steps.pr-state.outputs.base }}
        run: |
          set -euo pipefail
          branch=$(jq -rn --arg branch "$BASE_BRANCH" '$branch | @uri')
          gh api "repos/$GH_REPO/branches/$branch/protection" |
            jq -e '.enforce_admins.enabled == true and (.required_status_checks | .strict == true and ((.contexts | length) + (.checks | length) > 0))' > /dev/null
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
