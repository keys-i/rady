name: Koelu dependasolve

on:
  workflow_call:
    inputs:
      solver-ref:
        description: Trusted solver source, keys-i/koelu@40-lowercase-hex SHA
        required: true
        type: string
      app-client-id:
        required: true
        type: string
      repo:
        description: Installed target repository in OWNER/REPO form
        required: true
        type: string
      repo-owner:
        required: true
        type: string
      repo-name:
        required: true
        type: string
      repository-private:
        required: true
        type: boolean
      required-checks:
        description: JSON array of required CI check names
        required: true
        type: string
      model:
        type: string
        default: ''
      model-choices:
        description: Comma-separated native models available to Koelu's local selector
        type: string
        default: ''
      cloudflare-account-id:
        description: Central Cloudflare AI Gateway account identifier
        type: string
        default: ''
      gemini-private-ok:
        type: boolean
        default: false
      cerebras-private-ok:
        type: boolean
        default: false
      xai-private-ok:
        type: boolean
        default: false
      groq-private-ok:
        type: boolean
        default: false
      cloudflare-private-ok:
        type: boolean
        default: false
      openrouter-private-ok:
        type: boolean
        default: false
      harness:
        description: Installed, authenticated native agent CLI
        type: string
        default: codex
      pr-number:
        type: number
        default: 0
    secrets:
      app-private-key:
        required: true
      gemini-api-key:
        required: false
      cerebras-api-key:
        required: false
      xai-api-key:
        required: false
      groq-api-key:
        required: false
      cloudflare-api-token:
        required: false
      openrouter-api-key:
        required: false

permissions: {}

concurrency:
  group: koelu-${{ inputs.repo }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: inputs.pr-number > 0
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.pull.outputs.allowed }}
      dependency: ${{ steps.pull.outputs.dependency }}
      head: ${{ steps.pull.outputs.head }}
      number: ${{ steps.pull.outputs.number }}
    steps:
      - name: Create read-only target App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.repo-owner }}
          repositories: ${{ inputs.repo-name }}
          permission-contents: read
          permission-pull-requests: read
      - name: Validate trusted solver source
        id: source
        shell: bash
        env:
          SOLVER_REF: ${{ inputs.solver-ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOLVER_REF" =~ ^keys-i/koelu@([a-f0-9]{40})$ ]]; then
            echo 'solver-ref must be keys-i/koelu@40_LOWERCASE_COMMIT_SHA' >&2
            exit 1
          fi
          echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keys-i/koelu
          ref: ${{ steps.source.outputs.sha }}
          path: koelu-workflow-scripts
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false
      - name: Validate pull request trust boundary
        id: pull
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PRIVATE_REPOSITORY: ${{ inputs.repository-private }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: bash koelu-workflow-scripts/.github/workflows/scripts/pr-trust.sh

  review:
    needs: preflight
    if: needs.preflight.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.repo-owner }}
          repositories: ${{ inputs.repo-name }}
          permission-administration: read
          permission-contents: read
          permission-checks: read
          permission-statuses: read
          permission-pull-requests: write
      - name: Require a native public review harness
        if: inputs.repository-private != true
        shell: bash
        env:
          KOELU_HARNESS: ${{ inputs.harness }}
        run: |
          set -euo pipefail
          case "$KOELU_HARNESS" in
            codex|claude) ;;
            *) echo 'Public repositories require the bounded Codex or Claude harness' >&2; exit 1 ;;
          esac
      - name: Validate trusted solver source
        id: source
        shell: bash
        env:
          SOLVER_REF: ${{ inputs.solver-ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOLVER_REF" =~ ^keys-i/koelu@([a-f0-9]{40})$ ]]; then
            echo 'solver-ref must be keys-i/koelu@40_LOWERCASE_COMMIT_SHA' >&2
            exit 1
          fi
          echo 'repository=keys-i/koelu' >> "$GITHUB_OUTPUT"
          echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # Check out only the immutable solver source, never the PR or its scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Build the trusted solver
        run: cargo build --release --locked --bin koelu
      - name: Resolve PR author and commit
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
        run: target/release/koelu agent resolve --repo "$GH_REPO" --pr "$PR_NUMBER"
      - name: Recheck pull request identity
        shell: bash
        env:
          DEPENDENCY: ${{ steps.pr.outputs.dependency }}
          EXPECTED_DEPENDENCY: ${{ needs.preflight.outputs.dependency }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if [[ "$DEPENDENCY" != "$EXPECTED_DEPENDENCY" || "$HEAD" != "$EXPECTED_HEAD" ]]; then
            echo 'The pull request changed after preflight; rerun on the current state' >&2
            exit 1
          fi
      # == Canonical pull request evidence ==
      # Load fresh API state without checking out or running PR-controlled code
      - name: Fetch current pull request state
        id: pr-state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        run: bash .github/workflows/scripts/pr-state.sh
      - name: Review the diff and current CI evidence
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          KOELU_MODEL: ${{ inputs.model }}
          KOELU_MODEL_CHOICES: ${{ inputs.model-choices }}
          KOELU_HARNESS: ${{ inputs.harness }}
          KOELU_REPOSITORY_PRIVATE: ${{ inputs.repository-private }}
          KOELU_GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
          KOELU_CEREBRAS_API_KEY: ${{ secrets.cerebras-api-key }}
          KOELU_XAI_API_KEY: ${{ secrets.xai-api-key }}
          KOELU_GROQ_API_KEY: ${{ secrets.groq-api-key }}
          KOELU_CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          KOELU_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
          KOELU_OPENROUTER_API_KEY: ${{ secrets.openrouter-api-key }}
          KOELU_GEMINI_PRIVATE_OK: ${{ inputs.gemini-private-ok }}
          KOELU_CEREBRAS_PRIVATE_OK: ${{ inputs.cerebras-private-ok }}
          KOELU_XAI_PRIVATE_OK: ${{ inputs.xai-private-ok }}
          KOELU_GROQ_PRIVATE_OK: ${{ inputs.groq-private-ok }}
          KOELU_CLOUDFLARE_PRIVATE_OK: ${{ inputs.cloudflare-private-ok }}
          KOELU_OPENROUTER_PRIVATE_OK: ${{ inputs.openrouter-private-ok }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
          EXPECTED_HEAD: ${{ steps.pr-state.outputs.head }}
          UPDATE_TYPE: ${{ steps.pr.outputs.update_type }}
          MAINTAINER_CHANGES: ${{ steps.pr.outputs.maintainer_changes }}
        run: target/release/koelu agent review --repo "$GH_REPO" --pr "$PR_NUMBER"
