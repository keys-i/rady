name: Rady dependasolve

on:
  workflow_call:
    inputs:
      solver-ref:
        description: Trusted solver source, keys-i/rady@40-lowercase-hex SHA
        required: true
        type: string
      app-client-id:
        required: true
        type: string
      repo:
        description: Installed target repository in OWNER/REPO form
        required: true
        type: string
      repo-owner:
        required: true
        type: string
      repo-name:
        required: true
        type: string
      repository-private:
        required: true
        type: boolean
      required-checks:
        description: JSON array of required CI check names
        required: true
        type: string
      model:
        type: string
        default: ''
      model-choices:
        description: Comma-separated native models available to Rady's local selector
        type: string
        default: ''
      harness:
        description: Installed, authenticated native agent CLI
        type: string
        default: codex
      pr-number:
        type: number
        default: 0
    secrets:
      app-private-key:
        required: true
      gemini-api-key:
        required: false
      cerebras-api-key:
        required: false
      xai-api-key:
        required: false

permissions: {}

concurrency:
  group: rady-${{ inputs.repo }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  preflight:
    if: inputs.pr-number > 0
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.pull.outputs.allowed }}
      dependency: ${{ steps.pull.outputs.dependency }}
      head: ${{ steps.pull.outputs.head }}
      number: ${{ steps.pull.outputs.number }}
    steps:
      - name: Create read-only target App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.repo-owner }}
          repositories: ${{ inputs.repo-name }}
          permission-contents: read
          permission-pull-requests: read
      - name: Validate trusted solver source
        id: source
        shell: bash
        env:
          SOLVER_REF: ${{ inputs.solver-ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOLVER_REF" =~ ^keys-i/rady@([a-f0-9]{40})$ ]]; then
            echo 'solver-ref must be keys-i/rady@40_LOWERCASE_COMMIT_SHA' >&2
            exit 1
          fi
          echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keys-i/rady
          ref: ${{ steps.source.outputs.sha }}
          path: rady-workflow-scripts
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false
      - name: Validate pull request trust boundary
        id: pull
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PRIVATE_REPOSITORY: ${{ inputs.repository-private }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: bash rady-workflow-scripts/.github/workflows/scripts/validate-pr-trust.sh

  review:
    needs: preflight
    if: needs.preflight.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.repo-owner }}
          repositories: ${{ inputs.repo-name }}
          permission-administration: read
          permission-contents: write
          permission-checks: read
          permission-statuses: read
          permission-issues: write
          permission-pull-requests: write
      - name: Require a native public review harness
        if: inputs.repository-private != true
        shell: bash
        env:
          RADY_HARNESS: ${{ inputs.harness }}
        run: |
          set -euo pipefail
          case "$RADY_HARNESS" in
            codex|claude) ;;
            *) echo 'Public repositories require the bounded Codex or Claude harness' >&2; exit 1 ;;
          esac
      - name: Suspend stale Dependabot auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'PR number must be positive' >&2
            exit 1
          }
          pull=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          author=$(jq -er '.user.login | select(type == "string")' <<<"$pull")
          if [[ "$author" != 'dependabot[bot]' ]]; then
            exit 0
          fi
          if ! jq -e --arg repo "$GH_REPO" '
            .state == "open" and
            .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            ((.html_url | type) == "string") and
            (.html_url | startswith("https://github.com/" + $repo + "/pull/"))
          ' <<<"$pull" > /dev/null; then
            echo 'Dependabot PR state is not trusted; refusing to leave stale auto-merge enabled' >&2
            exit 1
          fi
          if jq -e '.auto_merge != null' <<<"$pull" > /dev/null; then
            url=$(jq -er '.html_url' <<<"$pull")
            gh pr merge "$url" --disable-auto
          fi
      - name: Validate trusted solver source
        id: source
        shell: bash
        env:
          SOLVER_REF: ${{ inputs.solver-ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOLVER_REF" =~ ^keys-i/rady@([a-f0-9]{40})$ ]]; then
            echo 'solver-ref must be keys-i/rady@40_LOWERCASE_COMMIT_SHA' >&2
            exit 1
          fi
          echo 'repository=keys-i/rady' >> "$GITHUB_OUTPUT"
          echo "sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # Check out only the immutable solver source, never the PR or its scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Identify Rust toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Rady build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rady-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ steps.source.outputs.sha }}-${{ hashFiles('Cargo.lock') }}
      - name: Build the trusted solver
        run: cargo build --release --locked --bin rady
      - name: Resolve PR author and commit
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
        run: target/release/rady agent resolve --repo "$GH_REPO" --pr "$PR_NUMBER"
      - name: Recheck pull request identity
        shell: bash
        env:
          DEPENDENCY: ${{ steps.pr.outputs.dependency }}
          EXPECTED_DEPENDENCY: ${{ needs.preflight.outputs.dependency }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          if [[ "$DEPENDENCY" != "$EXPECTED_DEPENDENCY" || "$HEAD" != "$EXPECTED_HEAD" ]]; then
            echo 'The pull request changed after preflight; rerun on the current state' >&2
            exit 1
          fi
      # == Canonical pull request evidence ==
      # Load fresh API state without checking out or running PR-controlled code
      - name: Fetch current pull request state
        id: pr-state
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        run: bash .github/workflows/scripts/fetch-pr-state.sh
      - name: Fetch verified Dependabot metadata
        if: steps.pr.outputs.dependency == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        env:
          # Supply the freshly verified PR payload for manual and check-run events
          GITHUB_EVENT_PATH: ${{ steps.pr-state.outputs.event }}
        with:
          compat-lookup: true
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Review the diff and current CI evidence
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RADY_MODEL: ${{ inputs.model }}
          RADY_MODEL_CHOICES: ${{ inputs.model-choices }}
          RADY_HARNESS: ${{ inputs.harness }}
          RADY_GEMINI_API_KEY: ${{ secrets.gemini-api-key }}
          RADY_CEREBRAS_API_KEY: ${{ secrets.cerebras-api-key }}
          RADY_XAI_API_KEY: ${{ secrets.xai-api-key }}
          RADY_REPOSITORY_PRIVATE: ${{ inputs.repository-private }}
          RADY_GEMINI_PRIVATE_OK: ${{ vars.RADY_GEMINI_PRIVATE_OK || 'false' }}
          RADY_CEREBRAS_PRIVATE_OK: ${{ vars.RADY_CEREBRAS_PRIVATE_OK || 'false' }}
          RADY_XAI_PRIVATE_OK: ${{ vars.RADY_XAI_PRIVATE_OK || 'false' }}
          GH_REPO: ${{ inputs.repo }}
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
          EXPECTED_HEAD: ${{ steps.pr-state.outputs.head }}
          SCORE: ${{ steps.metadata.outputs.compatibility-score }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: target/release/rady agent review --repo "$GH_REPO" --pr "$PR_NUMBER"
      - name: Require protected branch and enable auto-merge
        if: >-
          steps.review.outputs.enable_auto_merge == 'true' &&
          fromJSON(steps.metadata.outputs.compatibility-score || '0') >= 95 &&
          fromJSON(steps.metadata.outputs.compatibility-score || '0') <= 100 &&
          contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type) &&
          steps.metadata.outputs.maintainer-changes == 'false' &&
          steps.pr-state.outputs.mergeable == 'true' &&
          steps.pr-state.outputs.mergeable_state == 'clean'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          PR_URL: ${{ steps.pr-state.outputs.url }}
          HEAD_SHA: ${{ steps.pr-state.outputs.head }}
          BASE_BRANCH: ${{ steps.pr-state.outputs.base }}
        run: |
          set -euo pipefail
          branch=$(jq -rn --arg branch "$BASE_BRANCH" '$branch | @uri')
          gh api "repos/$GH_REPO/branches/$branch/protection" |
            jq -e '.enforce_admins.enabled == true and (.required_status_checks | .strict == true and ((.contexts | length) + (.checks | length) > 0))' > /dev/null
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
