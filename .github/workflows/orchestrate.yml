name: Rady orchestration

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rady-central-orchestration
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out central Rady service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build trusted Rady
        run: cargo build --release --locked --bin rady
      - name: Process consented RadDuck work
        env:
          RADY_APP_CLIENT_ID: ${{ vars.RADY_APP_CLIENT_ID }}
          RADY_APP_PRIVATE_KEY: ${{ secrets.RADY_APP_PRIVATE_KEY }}
          RADY_APP_SLUG: ${{ vars.RADY_APP_SLUG }}
          RADY_GEMINI_API_KEY: ${{ secrets.RADY_GEMINI_API_KEY }}
          RADY_CEREBRAS_API_KEY: ${{ secrets.RADY_CEREBRAS_API_KEY }}
          RADY_XAI_API_KEY: ${{ secrets.RADY_XAI_API_KEY }}
          RADY_GROQ_API_KEY: ${{ secrets.RADY_GROQ_API_KEY }}
          RADY_CLOUDFLARE_API_TOKEN: ${{ secrets.RADY_CLOUDFLARE_API_TOKEN }}
          RADY_CLOUDFLARE_ACCOUNT_ID: ${{ vars.RADY_CLOUDFLARE_ACCOUNT_ID }}
          RADY_OPENROUTER_API_KEY: ${{ secrets.RADY_OPENROUTER_API_KEY }}
          RADY_GEMINI_PRIVATE_OK: ${{ vars.RADY_GEMINI_PRIVATE_OK || 'false' }}
          RADY_CEREBRAS_PRIVATE_OK: ${{ vars.RADY_CEREBRAS_PRIVATE_OK || 'false' }}
          RADY_XAI_PRIVATE_OK: ${{ vars.RADY_XAI_PRIVATE_OK || 'false' }}
          RADY_GROQ_PRIVATE_OK: ${{ vars.RADY_GROQ_PRIVATE_OK || 'false' }}
          RADY_CLOUDFLARE_PRIVATE_OK: ${{ vars.RADY_CLOUDFLARE_PRIVATE_OK || 'false' }}
          RADY_OPENROUTER_PRIVATE_OK: ${{ vars.RADY_OPENROUTER_PRIVATE_OK || 'false' }}
          RADY_MODEL: ${{ vars.RADY_MODEL || '' }}
          RADY_MODEL_CHOICES: ${{ vars.RADY_MODEL_CHOICES || '' }}
          RADY_HARNESS: ${{ vars.RADY_HARNESS || 'codex' }}
        run: target/release/rady agent serve --once
