name: Rady orchestration

on:
  schedule:
    - cron: '2-57/5 * * * *'
    - cron: '11-59/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rady-central-orchestration
  cancel-in-progress: false

jobs:
  mentions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create owner-scoped Rady App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RADY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}
          owner: keys-i
          permission-contents: read
          permission-checks: read
          permission-statuses: read
          permission-issues: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build trusted Rady
        run: cargo build --release --locked --bin rady
      - name: Answer pending trusted mentions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RADY_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RADY_GEMINI_API_KEY: ${{ secrets.RADY_GEMINI_API_KEY }}
          RADY_CEREBRAS_API_KEY: ${{ secrets.RADY_CEREBRAS_API_KEY }}
          RADY_XAI_API_KEY: ${{ secrets.RADY_XAI_API_KEY }}
          RADY_GEMINI_PRIVATE_OK: ${{ vars.RADY_GEMINI_PRIVATE_OK || 'false' }}
          RADY_CEREBRAS_PRIVATE_OK: ${{ vars.RADY_CEREBRAS_PRIVATE_OK || 'false' }}
          RADY_XAI_PRIVATE_OK: ${{ vars.RADY_XAI_PRIVATE_OK || 'false' }}
        run: target/release/rady agent sweep --owner keys-i

  select-reviews:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11-59/15 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - name: Create owner-scoped Rady App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RADY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}
          owner: keys-i
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false
      - name: Select pull requests needing review
        id: targets
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RADY_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RADY_OWNER: keys-i
        run: bash .github/workflows/scripts/select-central-targets.sh

  review:
    needs: select-reviews
    if: needs.select-reviews.outputs.has-targets == 'true'
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.select-reviews.outputs.matrix) }}
    uses: ./.github/workflows/solve.yml
    with:
      solver-ref: ${{ format('keys-i/rady@{0}', github.sha) }}
      app-client-id: ${{ vars.RADY_APP_CLIENT_ID }}
      repo: ${{ matrix.target.repo }}
      repo-owner: ${{ matrix.target.owner }}
      repo-name: ${{ matrix.target.name }}
      repository-private: ${{ matrix.target.private }}
      required-checks: ${{ toJSON(matrix.target.checks) }}
      model: ${{ vars.RADY_MODEL || '' }}
      model-choices: ${{ vars.RADY_MODEL_CHOICES || '' }}
      harness: ${{ vars.RADY_HARNESS || 'codex' }}
      pr-number: ${{ matrix.target.number }}
    secrets:
      app-private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}
      gemini-api-key: ${{ secrets.RADY_GEMINI_API_KEY }}
      cerebras-api-key: ${{ secrets.RADY_CEREBRAS_API_KEY }}
      xai-api-key: ${{ secrets.RADY_XAI_API_KEY }}
