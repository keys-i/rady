name: Pekin orchestration

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pekin-central-orchestration
  cancel-in-progress: false

jobs:
  mentions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out central Pekin service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build trusted Pekin
        run: cargo build --release --locked --bin pekin
      - name: Install the pinned hosted editing harness
        run: npm install --global --ignore-scripts --no-audit --no-fund @google/gemini-cli@0.61.0
      - name: Answer and deliver consented Pekin requests
        env:
          PEKIN_APP_CLIENT_ID: ${{ vars.PEKIN_APP_CLIENT_ID }}
          PEKIN_APP_PRIVATE_KEY: ${{ secrets.PEKIN_APP_PRIVATE_KEY }}
          PEKIN_APP_SLUG: ${{ vars.PEKIN_APP_SLUG }}
          PEKIN_GEMINI_API_KEY: ${{ secrets.PEKIN_GEMINI_API_KEY }}
          PEKIN_CEREBRAS_API_KEY: ${{ secrets.PEKIN_CEREBRAS_API_KEY }}
          PEKIN_XAI_API_KEY: ${{ secrets.PEKIN_XAI_API_KEY }}
          PEKIN_GROQ_API_KEY: ${{ secrets.PEKIN_GROQ_API_KEY }}
          PEKIN_CLOUDFLARE_API_TOKEN: ${{ secrets.PEKIN_CLOUDFLARE_API_TOKEN }}
          PEKIN_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PEKIN_CLOUDFLARE_ACCOUNT_ID }}
          PEKIN_OPENROUTER_API_KEY: ${{ secrets.PEKIN_OPENROUTER_API_KEY }}
          PEKIN_GEMINI_PRIVATE_OK: ${{ vars.PEKIN_GEMINI_PRIVATE_OK || 'false' }}
          PEKIN_CEREBRAS_PRIVATE_OK: ${{ vars.PEKIN_CEREBRAS_PRIVATE_OK || 'false' }}
          PEKIN_XAI_PRIVATE_OK: ${{ vars.PEKIN_XAI_PRIVATE_OK || 'false' }}
          PEKIN_GROQ_PRIVATE_OK: ${{ vars.PEKIN_GROQ_PRIVATE_OK || 'false' }}
          PEKIN_CLOUDFLARE_PRIVATE_OK: ${{ vars.PEKIN_CLOUDFLARE_PRIVATE_OK || 'false' }}
          PEKIN_OPENROUTER_PRIVATE_OK: ${{ vars.PEKIN_OPENROUTER_PRIVATE_OK || 'false' }}
          PEKIN_MODEL: ${{ vars.PEKIN_MODEL || '' }}
          PEKIN_MODEL_CHOICES: ${{ vars.PEKIN_MODEL_CHOICES || '' }}
          PEKIN_HARNESS: command
          PEKIN_AGENT_COMMAND: bash ${{ github.workspace }}/.github/workflows/scripts/gemini.sh
          PEKIN_REVIEW_COMMAND: bash ${{ github.workspace }}/.github/workflows/scripts/gemini.sh
          PEKIN_COMMAND_ALLOW_GEMINI: '1'
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'GitHub run number is invalid' >&2
            exit 1
          }
          export PEKIN_INSTALLATION_SEED="$GITHUB_RUN_NUMBER"
          target/release/pekin agent serve --once

  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - name: Check out central Pekin service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build trusted Pekin
        run: cargo build --release --locked --bin pekin
      - name: Find consented pull requests
        id: targets
        env:
          PEKIN_APP_CLIENT_ID: ${{ vars.PEKIN_APP_CLIENT_ID }}
          PEKIN_APP_PRIVATE_KEY: ${{ secrets.PEKIN_APP_PRIVATE_KEY }}
          PEKIN_APP_SLUG: ${{ vars.PEKIN_APP_SLUG }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'GitHub run number is invalid' >&2
            exit 1
          }
          export PEKIN_INSTALLATION_SEED="$GITHUB_RUN_NUMBER"
          export PEKIN_TARGET_SEED="$GITHUB_RUN_NUMBER"
          matrix=$(target/release/pekin agent targets --max-reviews 4)
          jq -e '.include | type == "array" and length <= 4' <<<"$matrix" > /dev/null
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
          if [[ $(jq '.include | length' <<<"$matrix") == 0 ]]; then
            echo 'has-targets=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has-targets=true' >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: targets
    if: needs.targets.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.targets.outputs.matrix).include }}
    uses: ./.github/workflows/solve.yml
    with:
      solver-ref: ${{ matrix.solver_ref }}
      app-client-id: ${{ vars.PEKIN_APP_CLIENT_ID }}
      repo: ${{ matrix.repo }}
      repo-owner: ${{ matrix.owner }}
      repo-name: ${{ matrix.name }}
      repository-private: ${{ matrix.private }}
      required-checks: ${{ toJSON(matrix.checks) }}
      model: ${{ vars.PEKIN_MODEL || '' }}
      model-choices: ${{ vars.PEKIN_MODEL_CHOICES || '' }}
      cloudflare-account-id: ${{ vars.PEKIN_CLOUDFLARE_ACCOUNT_ID || '' }}
      gemini-private-ok: ${{ vars.PEKIN_GEMINI_PRIVATE_OK == 'true' }}
      cerebras-private-ok: ${{ vars.PEKIN_CEREBRAS_PRIVATE_OK == 'true' }}
      xai-private-ok: ${{ vars.PEKIN_XAI_PRIVATE_OK == 'true' }}
      groq-private-ok: ${{ vars.PEKIN_GROQ_PRIVATE_OK == 'true' }}
      cloudflare-private-ok: ${{ vars.PEKIN_CLOUDFLARE_PRIVATE_OK == 'true' }}
      openrouter-private-ok: ${{ vars.PEKIN_OPENROUTER_PRIVATE_OK == 'true' }}
      harness: ${{ vars.PEKIN_HARNESS || 'codex' }}
      pr-number: ${{ matrix.number }}
    secrets:
      app-private-key: ${{ secrets.PEKIN_APP_PRIVATE_KEY }}
      gemini-api-key: ${{ secrets.PEKIN_GEMINI_API_KEY }}
      cerebras-api-key: ${{ secrets.PEKIN_CEREBRAS_API_KEY }}
      xai-api-key: ${{ secrets.PEKIN_XAI_API_KEY }}
      groq-api-key: ${{ secrets.PEKIN_GROQ_API_KEY }}
      cloudflare-api-token: ${{ secrets.PEKIN_CLOUDFLARE_API_TOKEN }}
      openrouter-api-key: ${{ secrets.PEKIN_OPENROUTER_API_KEY }}
