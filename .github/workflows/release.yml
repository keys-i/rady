name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z GitHub release tag to recover to crates.io"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require the central release token
        env:
          RADY_RELEASE_TOKEN: ${{ secrets.RADY_RELEASE_TOKEN }}
        run: |
          if [[ -z "$RADY_RELEASE_TOKEN" ]]; then
            echo 'RADY_RELEASE_TOKEN is missing from the central repository' >&2
            exit 1
          fi
      - name: Prepare release PR or publish merged release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RADY_RELEASE_TOKEN }}
          target-branch: main
          config-file: tools/config/release-please.json
          manifest-file: tools/config/release-manifest.json
  publish:
    needs: release
    if: >-
      always() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (inputs.tag != '' || needs.release.outputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - name: Validate the immutable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RADY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'RADY_RELEASE_TOKEN is missing from the central repository' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected an exact vX.Y.Z release tag, got: $RELEASE_TAG" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --silent >/dev/null
      - name: Check out the immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify the crate source and publication state
        id: crate
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "rady") | .version')"
          if [[ "$actual" != "$expected" ]]; then
            echo "tag $RELEASE_TAG contains rady $actual, not $expected" >&2
            exit 1
          fi
          if ! status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/rady/$expected")"; then
            echo 'could not check crates.io publication state' >&2
            exit 1
          fi
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Publish the immutable crate
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
