name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create repository-scoped Rady App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RADY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Verify the release baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if baseline_error=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.6.0" --silent 2>&1); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$baseline_error" == *"HTTP 404"* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release baseline required::Publish v0.6.0 before Release Please"
          else
            printf '%s\n' "$baseline_error" >&2
            exit 1
          fi
      - name: Prepare release PR or publish merged release
        if: steps.baseline.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: tools/config/release-please.json
          manifest-file: tools/config/release-manifest.json
      - name: Check out the released source
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Publish the released crate
        if: steps.release.outputs.release_created == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
