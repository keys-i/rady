name: Rady dependasolve

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  workflow_run:
    workflows: ["Checks","Release","Security"]
    types: [completed]
    branches: ['dependabot/**']

  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  push:
    paths: ['.github/workflows/dependasolver.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Optional pull request number; leave blank to review the open Dependabot backlog
        required: false
        type: string

permissions: {}

jobs:
  select:
    name: Choose pull requests
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    concurrency:
      group: rady-selection-${{ github.repository }}-${{ inputs.pr-number || 'backlog' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-prs: ${{ steps.targets.outputs.has-prs }}
    steps:
      - name: Select requested or pending pull-request reviews
        id: targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr-number || '' }}
        run: |
          set -euo pipefail
          matrix='[]'

          emit() {
            jq -e 'type == "array" and length <= 100 and all(.[]; type == "number" and . > 0 and floor == .)' <<<"$matrix" > /dev/null
            {
              echo "matrix=$matrix"
              if [[ "$matrix" == '[]' ]]; then
                echo 'has-prs=false'
              else
                echo 'has-prs=true'
              fi
            } >> "$GITHUB_OUTPUT"
          }

          one() {
            [[ "$1" =~ ^[1-9][0-9]*$ ]] || return 0
            matrix=$(jq -cn --argjson number "$1" '[$number]')
          }

          backlog() {
            pulls='[]'
            for page in 1 2 3; do
              batch=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100&sort=created&direction=asc&page=$page")
              pulls=$(jq -ce --argjson batch "$batch" '. + $batch' <<<"$pulls")
              (( $(jq 'length' <<<"$batch") < 100 )) && break
            done
            if (( $(jq 'length' <<<"$batch") == 100 )); then
              extra=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=1&sort=created&direction=asc&page=301")
              [[ "$extra" == '[]' ]] || { echo 'Rady backfill supports at most 300 open pull requests' >&2; exit 1; }
            fi
            matrix=$(jq -cer --arg repo "$GH_REPO" --argjson private "$PRIVATE_REPOSITORY" '
              [.[] | select(
                .draft == false and
                ($private or (
                  .head.repo.full_name? == $repo and
                  .base.repo.full_name? == $repo and
                  (.user.login == "dependabot[bot]" or
                    .author_association == "OWNER" or
                    .author_association == "MEMBER" or
                    .author_association == "COLLABORATOR")
                ))
              ) | .number]
            ' <<<"$pulls")
            (( $(jq 'length' <<<"$matrix") <= 100 )) || { echo 'Rady backfill supports at most 100 eligible pull requests' >&2; exit 1; }
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ -n "$PR_NUMBER" ]]; then one "$PR_NUMBER"; else backlog; fi
              ;;
            push|schedule) backlog ;;
          esac
          emit

  review-current:
    name: Rady dependasolve gate
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.workflow_run.name, 'Rady dependasolve')) ||
      (github.event_name == 'check_run' &&
      github.event.check_run.status == 'completed' &&
      github.event.check_run.pull_requests[0].number > 0 &&
      !startsWith(github.event.check_run.name, 'Rady dependasolve gate') &&
      !startsWith(github.event.check_run.name, 'Rady dependasolve /'))
    permissions:
      contents: read
      pull-requests: write
    uses: keys-i/rady/.github/workflows/solve.yml@a04e2ba487e2f7c451ddd19bebea0217b1d9a8ff
    with:
      solver-ref: keys-i/rady@a04e2ba487e2f7c451ddd19bebea0217b1d9a8ff
      app-client-id: ${{ vars.RADY_APP_CLIENT_ID }}
      required-checks: '["test"]'
      model: ${{ vars.RADY_MODEL || '' }}
      model-choices: ${{ vars.RADY_MODEL_CHOICES || '' }}
      harness: ${{ vars.RADY_HARNESS || 'codex' }}
      pr-number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number }}
    secrets:
      app-private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}

  review:
    name: Rady dependasolve gate
    needs: select
    if: needs.select.outputs.has-prs == 'true'
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr-number: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: keys-i/rady/.github/workflows/solve.yml@a04e2ba487e2f7c451ddd19bebea0217b1d9a8ff
    with:
      solver-ref: keys-i/rady@a04e2ba487e2f7c451ddd19bebea0217b1d9a8ff
      app-client-id: ${{ vars.RADY_APP_CLIENT_ID }}
      required-checks: '["test"]'
      model: ${{ vars.RADY_MODEL || '' }}
      model-choices: ${{ vars.RADY_MODEL_CHOICES || '' }}
      harness: ${{ vars.RADY_HARNESS || 'codex' }}
      pr-number: ${{ matrix.pr-number }}
    secrets:
      app-private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}

  respond:
    name: Respond to Rady mention
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.comment.body == '@radyybot' ||
      startsWith(github.event.comment.body, '@radyybot ')) &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR')
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: keys-i/rady/.github/workflows/respond.yml@a04e2ba487e2f7c451ddd19bebea0217b1d9a8ff
    with:
      solver-ref: keys-i/rady@a04e2ba487e2f7c451ddd19bebea0217b1d9a8ff
      app-client-id: ${{ vars.RADY_APP_CLIENT_ID }}
      issue-number: ${{ github.event.issue.number }}
      comment-id: ${{ github.event.comment.id }}
      gemini-private-ok: ${{ vars.RADY_GEMINI_PRIVATE_OK == 'true' }}
      xai-private-ok: ${{ vars.RADY_XAI_PRIVATE_OK == 'true' }}
    secrets:
      app-private-key: ${{ secrets.RADY_APP_PRIVATE_KEY }}
      gemini-api-key: ${{ secrets.RADY_GEMINI_API_KEY }}
      cerebras-api-key: ${{ secrets.RADY_CEREBRAS_API_KEY }}
      xai-api-key: ${{ secrets.RADY_XAI_API_KEY }}
