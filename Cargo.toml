[package]
name = "koelu"
version = "0.6.9"
edition = "2024"
rust-version = "1.85"
description = "Checked coding changes, dependency reviews, and local-first agent workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/keys-i/rady"
keywords = ["coding-agent", "dependabot", "dependency-review", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/.github/CODE_OF_CONDUCT.md",
    "/.github/CONTRIBUTING.md",
    "/.github/PULL_REQUEST_TEMPLATE.md",
    "/.github/SECURITY.md",
    "/.github/workflows/orchestrate.yml",
    "/.github/workflows/solve.yml",
    "/.github/workflows/scripts/gemini-policy.toml",
    "/.github/workflows/scripts/gemini.sh",
    "/.github/workflows/scripts/pr-state.sh",
    "/.github/workflows/scripts/pr-trust.sh",
    "/docs/*.md",
    "/docs/assets/koelu-poster.webp",
    "/assets/koelu-app-duck.png",
    "/src/*.rs",
    "/src/cli/*.rs",
    "/src/agent/*.rs",
    "/src/delivery/*.rs",
    "/src/github/*.rs",
    "/src/github/mentions/*.rs",
    "/src/github/mentions/providers/*.rs",
    "/src/github/reviews/*.rs",
    "/src/github/service/*.rs",
    "/src/github/setup/*.rs",
    "/src/ui/*.rs",
    "/tests/*.rs",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
latex2mathml = "0.2"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
pulldown-cmark = "0.13"
regex = "1.11"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "koelu"
path = "src/main.rs"
