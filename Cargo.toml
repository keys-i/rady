[package]
name = "rady"
version = "0.5.7"
edition = "2024"
rust-version = "1.85"
description = "Checked coding changes, dependency reviews, and local-first agent workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/keys-i/rady"
keywords = ["coding-agent", "dependabot", "dependency-review", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/.github/workflows/orchestrate.yml",
    "/.github/workflows/solve.yml",
    "/.github/workflows/scripts/fetch-pr-state.sh",
    "/.github/workflows/scripts/select-central-targets.sh",
    "/.github/workflows/scripts/validate-pr-trust.sh",
    "/docs/*.md",
    "/docs/assets/rady-poster.webp",
    "/src/*.rs",
    "/src/agent/*.rs",
    "/src/bin/*.rs",
    "/src/delivery/*.rs",
    "/src/github/*.rs",
    "/src/mentions/*.rs",
    "/src/mentions/providers/*.rs",
    "/src/reviews/*.rs",
    "/src/routing/*.rs",
    "/src/service/*.rs",
    "/src/setup/*.rs",
    "/src/dependasolver/assets/*.png",
    "/src/dependasolver/templates/*.html",
    "/src/dependasolver/templates/*.yml",
    "/tests/*.rs",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
latex2mathml = "0.2"
nix = { version = "0.30", features = ["fs", "process", "signal"] }
pulldown-cmark = "0.13"
regex = "1.11"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "rady"
path = "src/main.rs"

[[bin]]
name = "dependasolver"
path = "src/bin/dependasolver.rs"
